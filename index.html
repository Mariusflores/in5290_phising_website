<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comments</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Complete your nomination for the Black Badge</h1>
    <h2>Please create account</h2>
    <form id="comment-form">
      <label>Username
        <input name="username" required maxlength="100" autocomplete="off">
      </label>
      <label>Password
        <textarea name="comment" required maxlength="2000" rows="5"></textarea>
      </label>
      <!-- honeypot: hidden from humans, bots tend to fill it -->
      <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
      <button type="submit">Post</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
